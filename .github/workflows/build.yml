name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            python3 \
            dpkg-dev \
            libfuse2 \
            flatpak \
            flatpak-builder

      - name: Install Flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          sudo flatpak install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install linuxdeploy
        run: |
          sudo curl -L \
            -o /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage

          sudo chmod +x /usr/local/bin/linuxdeploy

      - name: Build Framebolt
        run: |
          cargo build -p framebolt-desktop --release

      - name: Package AppImage
        run: |
          ./scripts/linux/package_appimage.sh

      - name: Package Debian
        run: |
          ./scripts/linux/package_deb.sh

      # - name: Package AUR
      #   run: |
      #     ./scripts/linux/package_aur.sh

      - name: Package RPM
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -c '
              dnf install -y \
                cargo \
                rpm-build \
                tar \
                gzip \
                python3

              ./scripts/linux/package_rpm.sh
            '

      - name: Package Flatpak
        run: |
          ./scripts/linux/package_flatpak.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: framebolt-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
          if-no-files-found: error