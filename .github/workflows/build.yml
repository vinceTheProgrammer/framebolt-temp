name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  # ------------------------------------------------------------
  # Debian / .deb
  # ------------------------------------------------------------
  build-deb-x64:
    name: Build & Package Debian (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            python3 \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release

      - name: Package Debian
        run: |
          ./scripts/linux/package_deb.sh

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-deb-x64
          path: dist/*.deb
          if-no-files-found: error

  build-deb-arm64:
    name: Build & Package Debian (arm64)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            python3 \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release

      - name: Package Debian
        run: |
          ./scripts/linux/package_deb.sh

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-deb-arm64
          path: dist/*.deb
          if-no-files-found: error


  # ------------------------------------------------------------
  # Fedora / RPM
  # ------------------------------------------------------------
  build-rpm-fedora-x64:
    name: Build & Package Fedora RPM (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM - Fedora
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -c '
              set -euo pipefail

              echo "==> Installing Fedora dependencies"

              dnf install -y \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer1 \
                gstreamer1-devel \
                gstreamer1-plugins-base \
                gstreamer1-plugins-base-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Packaging Fedora RPM"

              ./scripts/linux/package_rpm_fedora.sh

              echo "==> RPM output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.rpm" -print -quit)"
            '

      - name: Upload Fedora RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-rpm-fedora-x64
          path: dist/*.rpm
          if-no-files-found: error

