  build-arch-x64:
    name: Build Arch binary (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                pkgconf \
                python \
                gstreamer \
                gst-plugins-base \
                glib2

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build \
                -p framebolt-desktop \
                --release

              mkdir -p dist

              install -Dm755 \
                target/release/framebolt-desktop \
                dist/framebolt-x86_64
            '

      - name: Verify Arch binary
        run: |
          file dist/framebolt-x86_64
          readelf -d dist/framebolt-x86_64 | grep NEEDED

      - name: Upload Arch binary
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-x86_64
          path: dist/framebolt-x86_64
          if-no-files-found: error

  build-arch-arm64:
    name: Build Arch binary (aarch64)
