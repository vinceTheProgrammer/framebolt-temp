          cargo build \
            -p framebolt-desktop \
            --release \
            --target aarch64-apple-darwin

      - name: Create macOS app bundle
        run: |
          APP="target/release/framebolt-desktop.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

