name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  # ------------------------------------------------------------
  # Debian / .deb
  # ------------------------------------------------------------
  build-deb:
    name: Build & Package Debian
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            python3 \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release

      - name: Package Debian
        run: |
          ./scripts/linux/package_deb.sh

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-deb
          path: dist/*.deb
          if-no-files-found: error


  # ------------------------------------------------------------
  # Fedora / RPM
  # ------------------------------------------------------------
  build-rpm-fedora:
    name: Build & Package Fedora RPM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM - Fedora
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -c '
              set -euo pipefail

              echo "==> Installing Fedora dependencies"

              dnf install -y \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer1 \
                gstreamer1-devel \
                gstreamer1-plugins-base \
                gstreamer1-plugins-base-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Packaging Fedora RPM"

              ./scripts/linux/package_rpm_fedora.sh

              echo "==> RPM output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.rpm" -print -quit)"
            '

      - name: Upload Fedora RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-rpm-fedora
          path: dist/*.rpm
          if-no-files-found: error


  # ------------------------------------------------------------
  # openSUSE Leap / RPM
  # ------------------------------------------------------------
  build-rpm-opensuse:
    name: Build & Package openSUSE RPM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM - openSUSE
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            opensuse/leap:15.6 \
            bash -c '
              set -euo pipefail

              echo "==> Refreshing openSUSE repositories"

              zypper --non-interactive refresh

              echo "==> Installing openSUSE dependencies"

              zypper --non-interactive install \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer-devel \
                gstreamer

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Packaging openSUSE RPM"

              ./scripts/linux/package_rpm_opensuse.sh

              echo "==> RPM output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.rpm" -print -quit)"
            '

      - name: Upload openSUSE RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-rpm-opensuse
          path: dist/*.rpm
          if-no-files-found: error


  # ------------------------------------------------------------
  # AppImage
  #
  # Built inside Rocky Linux 8 to target an older glibc while
  # still providing a sufficiently modern Linux userspace for
  # the Rust/GStreamer stack.
  # ------------------------------------------------------------
  build-appimage-x64:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage in Rocky Linux 8
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:8 \
            bash -c '
              set -euo pipefail

              echo "==> Architecture"
              uname -m

              test "$(uname -m)" = "x86_64"

              echo "==> Installing dependencies"

              dnf install -y \
                epel-release

              dnf install -y \
                curl \
                file \
                gcc \
                gcc-c++ \
                make \
                pkgconf-pkg-config \
                python3 \
                findutils \
                libunwind-devel \
                gstreamer1-devel \
                glib2-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> GStreamer"

              pkg-config --modversion gstreamer-1.0
              pkg-config --cflags --libs gstreamer-1.0

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Installing linuxdeploy"

              curl -fL \
                -o /usr/local/bin/linuxdeploy \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage

              chmod +x /usr/local/bin/linuxdeploy

              export APPIMAGE_EXTRACT_AND_RUN=1

              echo "==> Packaging AppImage"

              ./scripts/linux/package_appimage.sh

              echo "==> Verifying AppImage"

              ls -lah dist/

              APPIMAGE="$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)"

              test -n "$APPIMAGE"

              file "$APPIMAGE"

              echo "==> Done"
            '

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-appimage-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  build-appimage-arm64:
    name: Build AppImage (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage in Rocky Linux 8
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:8 \
            bash -c '
              set -euo pipefail

              echo "==> Architecture"
              uname -m

              test "$(uname -m)" = "aarch64"

              echo "==> Installing dependencies"

              dnf install -y \
                epel-release

              dnf install -y \
                curl \
                file \
                gcc \
                gcc-c++ \
                make \
                pkgconf-pkg-config \
                python3 \
                findutils \
                libunwind-devel \
                gstreamer1-devel \
                glib2-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> GStreamer"

              pkg-config --modversion gstreamer-1.0
              pkg-config --cflags --libs gstreamer-1.0

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Installing linuxdeploy"

              curl -fL \
                -o /usr/local/bin/linuxdeploy \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-aarch64.AppImage

              chmod +x /usr/local/bin/linuxdeploy

              export APPIMAGE_EXTRACT_AND_RUN=1

              echo "==> Packaging AppImage"

              ./scripts/linux/package_appimage.sh

              echo "==> Verifying AppImage"

              ls -lah dist/

              APPIMAGE="$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)"

              test -n "$APPIMAGE"

              file "$APPIMAGE"

              echo "==> Done"
            '

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-appimage-arm64
          path: dist/*.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------
  # Flatpak
  # ------------------------------------------------------------
  build-flatpak-x64:
    name: Build & Package Flatpak (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            flatpak \
            flatpak-builder

      - name: Install Flatpak runtime
        run: |
         sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release
          
      - name: Package Flatpak
        run: |
          ./scripts/linux/package_flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error

  build-flatpak-arm64:
    name: Build & Package Flatpak (arm64)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            flatpak \
            flatpak-builder

      - name: Install Flatpak runtime
        run: |
         sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release
          
      - name: Package Flatpak
        run: |
          ./scripts/linux/package_flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-flatpak-arm64
          path: dist/*.flatpak
          if-no-files-found: error

  build-snap-x64:
    name: Build & Package Snap (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Snap package
        run: |
          ./scripts/linux/init_package_snap.sh

      - name: Build Snap
        uses: canonical/action-build@v1
        id: snapcraft

      - name: Copy Snap to dist
        run: |
          mkdir -p dist
          cp "${{ steps.snapcraft.outputs.snap }}" dist/framebolt-x86_64.snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-snap-x86_64
          path: dist/*.snap
          if-no-files-found: error

  build-snap-arm64:
    name: Build & Package Snap (arm64)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Snap package
        run: |
          ./scripts/linux/init_package_snap.sh

      - name: Build Snap
        uses: canonical/action-build@v1
        id: snapcraft

      - name: Copy Snap to dist
        run: |
          mkdir -p dist
          cp "${{ steps.snapcraft.outputs.snap }}" dist/framebolt-arm64.snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-snap-arm64
          path: dist/*.snap
          if-no-files-found: error
  
  build-arch-x64:
    name: Build Arch binary (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                pkgconf \
                python \
                gstreamer \
                gst-plugins-base \
                glib2

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build \
                -p framebolt-desktop \
                --release

              mkdir -p dist

              install -Dm755 \
                target/release/framebolt-desktop \
                dist/framebolt-x86_64
            '

      - name: Verify Arch binary
        run: |
          file dist/framebolt-x86_64
          readelf -d dist/framebolt-x86_64 | grep NEEDED

      - name: Upload Arch binary
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-x86_64
          path: dist/framebolt-x86_64
          if-no-files-found: error

  build-arch-arm64:
    name: Build Arch binary (aarch64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                pkgconf \
                python \
                gstreamer \
                gst-plugins-base \
                glib2

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build \
                -p framebolt-desktop \
                --release

              mkdir -p dist

              install -Dm755 \
                target/release/framebolt-desktop \
                dist/framebolt-arm64
            '

      - name: Verify Arch binary
        run: |
          file dist/framebolt-arm64
          readelf -d dist/framebolt-arm64 | grep NEEDED

      - name: Upload Arch binary
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-arm64
          path: dist/framebolt-arm64
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install GStreamer
        shell: pwsh
        run: |
          $GStreamerVersion = "1.26.7"
          $GStreamerInstallDir = "C:\gstreamer"
          $GStreamerRoot = "C:\gstreamer\1.0\msvc_x86_64"

          $BaseUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$GStreamerVersion/msvc"

          $DevelUrl = "$BaseUrl/gstreamer-1.0-devel-msvc-x86_64-$GStreamerVersion.msi"
          $RuntimeUrl = "$BaseUrl/gstreamer-1.0-msvc-x86_64-$GStreamerVersion.msi"

          $DevelMsi = Join-Path $env:RUNNER_TEMP "gstreamer-devel.msi"
          $RuntimeMsi = Join-Path $env:RUNNER_TEMP "gstreamer-runtime.msi"

          Write-Host "Downloading GStreamer development package..."
          Invoke-WebRequest `
            -Uri $DevelUrl `
            -OutFile $DevelMsi

          Write-Host "Installing GStreamer development package..."

          $Process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              "`"$DevelMsi`""
              "/qn"
              "INSTALLDIR=$GStreamerInstallDir"
              "/L*v"
              "`"$env:RUNNER_TEMP\gstreamer-devel.log`""
            ) `
            -Wait `
            -PassThru

          if ($Process.ExitCode -ne 0) {
            Write-Host "GStreamer development installation failed with exit code $($Process.ExitCode)"
            Get-Content "$env:RUNNER_TEMP\gstreamer-devel.log" -Tail 50
            exit 1
          }

          Write-Host "GStreamer development package installed successfully."

          Write-Host "Downloading GStreamer runtime package..."
          Invoke-WebRequest `
            -Uri $RuntimeUrl `
            -OutFile $RuntimeMsi

          Write-Host "Installing GStreamer runtime package..."

          $Process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              "`"$RuntimeMsi`""
              "/qn"
              "INSTALLDIR=$GStreamerInstallDir"
              "/L*v"
              "`"$env:RUNNER_TEMP\gstreamer-runtime.log`""
            ) `
            -Wait `
            -PassThru

          if ($Process.ExitCode -ne 0) {
            Write-Host "GStreamer runtime installation failed with exit code $($Process.ExitCode)"
            Get-Content "$env:RUNNER_TEMP\gstreamer-runtime.log" -Tail 50
            exit 1
          }

          Write-Host "GStreamer runtime package installed successfully."

          if (-not (Test-Path "$GStreamerRoot\bin")) { 
            throw "GStreamer bin directory was not found: $GStreamerRoot\bin" 
          } 
          
          Write-Host "GStreamer installed at:" 
          Write-Host " $GStreamerRoot"

          Write-Host "Adding GStreamer to PATH..." 
          "$GStreamerRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

          Write-Host "GStreamer installation complete."

      - name: Verify GStreamer
        shell: pwsh
        run: |
          $GStreamerRoot = "C:\gstreamer\1.0\msvc_x86_64"

          Write-Host "Checking GStreamer installation..."
          
          if (-not (Test-Path $GStreamerRoot)) {
            throw "GStreamer installation directory was not found: $GStreamerRoot"
          }

          if (-not (Test-Path "$GStreamerRoot\bin")) {
            throw "GStreamer bin directory was not found: $GStreamerRoot\bin"
          }

          if (-not (Test-Path "$GStreamerRoot\lib\gstreamer-1.0")) {
            throw "GStreamer plugin directory was not found: $GStreamerRoot\lib\gstreamer-1.0"
          }

          Write-Host "GStreamer installation found at:"
          Write-Host "  $GStreamerRoot"

          Write-Host ""
          Write-Host "GStreamer version:"
          & "$GStreamerRoot\bin\gst-launch-1.0.exe" --version

          if ($LASTEXITCODE -ne 0) {
            throw "gst-launch-1.0 failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Checking GStreamer plugins..."

          $PluginCount = @(Get-ChildItem "$GStreamerRoot\lib\gstreamer-1.0" -Filter "*.dll").Count

          if ($PluginCount -eq 0) {
            throw "No GStreamer plugins were found."
          }

          Write-Host "Found $PluginCount GStreamer plugin DLL(s)."

          Write-Host ""
          Write-Host "GStreamer verification successful."

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $Version = cargo metadata `
            --format-version 1 `
            --no-deps |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Select-Object -First 1 |
            Select-Object -ExpandProperty version

          "version=$Version" >> $env:GITHUB_OUTPUT
          "FRAMEBOLT_VERSION=$Version" >> $env:GITHUB_ENV

      - name: Build Framebolt
        shell: pwsh
        run: |
          cargo build `
            --release `
            --locked `
            -p framebolt-desktop `
            --target x86_64-pc-windows-msvc

      - name: Prepare Windows staging directory
        shell: pwsh
        run: |
          $GStreamerRoot = "C:\gstreamer\1.0\msvc_x86_64"

          $ErrorActionPreference = "Stop"

          $Stage = "dist/windows-staging"

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $Stage

          New-Item `
            -ItemType Directory `
            -Force `
            $Stage | Out-Null

          Copy-Item `
            "target/x86_64-pc-windows-msvc/release/framebolt-desktop.exe" `
            "$Stage/framebolt.exe"

          Write-Host "Copying GStreamer runtime DLLs..."

          Copy-Item `
            "$GStreamerRoot\bin\*.dll" `
            "$Stage" `
            -Force

          New-Item `
            -ItemType Directory `
            -Force `
            "$Stage/lib/gstreamer-1.0" | Out-Null

          Copy-Item `
            "$GStreamerRoot/lib/gstreamer-1.0/*.dll" `
            "$Stage/lib/gstreamer-1.0" `
            -Force

          Write-Host "Windows staging contents:"

          Get-ChildItem `
            $Stage `
            -Recurse |
            Select-Object FullName, Length

      - name: Verify Windows binary
        shell: pwsh
        run: |
          $Binary = "dist/windows-staging/framebolt.exe"

          if (-not (Test-Path $Binary)) {
            throw "Windows binary was not created."
          }

          Get-Item $Binary |
            Format-List Name, Length, FullName

      - name: Upload Windows staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-windows-staging
          path: dist/windows-staging/
          if-no-files-found: error

  build-windows-portable:
    name: Build Windows Portable
    runs-on: windows-2022

    needs:
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows staging
        uses: actions/download-artifact@v8
        with:
          name: framebolt-windows-staging
          path: dist/windows-staging

      - name: Get version
        shell: pwsh
        run: |
          $Version = cargo metadata `
            --format-version 1 `
            --no-deps |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Select-Object -First 1 |
            Select-Object -ExpandProperty version

          "FRAMEBOLT_VERSION=$Version" >> $env:GITHUB_ENV

      - name: Package portable ZIP
        shell: pwsh
        run: |
          ./scripts/windows/package_windows_portable.ps1

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-windows-portable
          path: dist/*.zip
          if-no-files-found: error

  build-windows-installer:
    name: Build Windows Installer
    runs-on: windows-2022

    needs:
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows staging
        uses: actions/download-artifact@v8
        with:
          name: framebolt-windows-staging
          path: dist/windows-staging

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Get version
        shell: pwsh
        run: |
          $Version = cargo metadata `
            --format-version 1 `
            --no-deps |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Select-Object -First 1 |
            Select-Object -ExpandProperty version

          "FRAMEBOLT_VERSION=$Version" >> $env:GITHUB_ENV

      - name: Package Windows installer
        shell: pwsh
        run: |
          ./scripts/windows/package_windows_installer.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-windows-installer
          path: dist/*.exe
          if-no-files-found: error

  build-macos-arm:
    name: Build & Package MacOS (arm64)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GStreamer
        run: brew install gstreamer

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-apple-darwin

      - name: Build Framebolt aarch64
        run: |
          cargo build \
            -p framebolt-desktop \
            --release \
            --target aarch64-apple-darwin

      - name: Create macOS app bundle
        run: |
          APP="target/release/framebolt-desktop.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp \
            "target/aarch64-apple-darwin/release/framebolt-desktop" \
            "$APP/Contents/MacOS/framebolt-desktop"

      - name: Bundle GStreamer
        run: ./scripts/macos/bundle_gstreamer.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package macOS app
        run: |
          mkdir -p dist

          ditto -c -k --sequesterRsrc --keepParent \
            target/release/framebolt-desktop.app \
            "dist/framebolt-${VERSION}-macos-arm64.zip"

      - name: Upload MacOS .zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-macos-arm
          path: dist/*.zip
          if-no-files-found: error

