name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  # ------------------------------------------------------------
  # Debian / .deb
  # ------------------------------------------------------------
  build-deb:
    name: Build & Package Debian
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            python3 \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release

      - name: Package Debian
        run: |
          ./scripts/linux/package_deb.sh

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-deb
          path: dist/*.deb
          if-no-files-found: error


  # ------------------------------------------------------------
  # Fedora / RPM
  # ------------------------------------------------------------
  build-rpm-fedora:
    name: Build & Package Fedora RPM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM - Fedora
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -c '
              set -euo pipefail

              echo "==> Installing Fedora dependencies"

              dnf install -y \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer1 \
                gstreamer1-devel \
                gstreamer1-plugins-base \
                gstreamer1-plugins-base-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Packaging Fedora RPM"

              ./scripts/linux/package_rpm_fedora.sh

              echo "==> RPM output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.rpm" -print -quit)"
            '

      - name: Upload Fedora RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-rpm-fedora
          path: dist/*.rpm
          if-no-files-found: error


  # ------------------------------------------------------------
  # openSUSE Leap / RPM
  # ------------------------------------------------------------
  build-rpm-opensuse:
    name: Build & Package openSUSE RPM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM - openSUSE
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            opensuse/leap:15.6 \
            bash -c '
              set -euo pipefail

              echo "==> Refreshing openSUSE repositories"

              zypper --non-interactive refresh

              echo "==> Installing openSUSE dependencies"

              zypper --non-interactive install \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer-devel \
                gstreamer

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Packaging openSUSE RPM"

              ./scripts/linux/package_rpm_opensuse.sh

              echo "==> RPM output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.rpm" -print -quit)"
            '

      - name: Upload openSUSE RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-rpm-opensuse
          path: dist/*.rpm
          if-no-files-found: error


  # ------------------------------------------------------------
  # AppImage
  #
  # Built inside Rocky Linux 8 to target an older glibc while
  # still providing a sufficiently modern Linux userspace for
  # the Rust/GStreamer stack.
  # ------------------------------------------------------------
  build-appimage:
    name: Build & Package AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage in Rocky Linux 8
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:8 \
            bash -c '
              set -euo pipefail

              echo "==> Installing dependencies"

              dnf install -y \
                epel-release

              dnf install -y \
                curl \
                file \
                gcc \
                gcc-c++ \
                make \
                pkgconf-pkg-config \
                python3 \
                findutils \
                libunwind-devel \
                gstreamer1-devel \
                glib2-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> GStreamer"

              pkg-config --modversion gstreamer-1.0
              pkg-config --cflags --libs gstreamer-1.0

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Installing linuxdeploy"

              curl -fL \
                -o /usr/local/bin/linuxdeploy \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage

              chmod +x /usr/local/bin/linuxdeploy

              export APPIMAGE_EXTRACT_AND_RUN=1

              echo "==> Packaging AppImage"

              ./scripts/linux/package_appimage.sh

              echo "==> AppImage output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)"
            '

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-appimage
          path: dist/*.AppImage
          if-no-files-found: error


  # ------------------------------------------------------------
  # Flatpak
  # ------------------------------------------------------------
  build-flatpak:
    name: Build & Package Flatpak
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            flatpak \
            flatpak-builder

      - name: Install Flatpak runtime
        run: |
         sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release
          
      - name: Package Flatpak
        run: |
          ./scripts/linux/package_flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  build-snap:
    name: Build & Package Snap
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Snap package
        run: |
          ./scripts/linux/init_package_snap.sh

      - name: Build Snap
        uses: canonical/action-build@v1
        id: snapcraft

      - name: Copy Snap to dist
        run: |
          mkdir -p dist
          cp "${{ steps.snapcraft.outputs.snap }}" dist/

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-snap
          path: dist/*.snap
          if-no-files-found: error
  
  build-arch:
    name: Build & Package Arch
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                pkgconf \
                python \
                gstreamer \
                gst-plugins-base \
                glib2

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build \
                -p framebolt-desktop \
                --release

              mkdir -p dist

              install -Dm755 \
                target/release/framebolt-desktop \
                dist/framebolt-x86_64
            '

      - name: Verify Arch binary
        run: |
          file dist/framebolt-x86_64
          readelf -d dist/framebolt-x86_64 | grep NEEDED

      - name: Upload Arch binary
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-x86_64
          path: dist/framebolt-x86_64
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04

    needs:
      - build-deb
      - build-rpm-fedora
      - build-rpm-opensuse
      - build-flatpak
      - build-appimage
      - build-snap
      - build-arch

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: '*'
          merge-multiple: true

      - name: List release artifacts
        run: |
          find release-artifacts \
            -type f \
            -maxdepth 2 \
            -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create \
            "v${VERSION}" \
            release-artifacts/* \
            --title "Framebolt v${VERSION}" \
            --generate-notes

  package-aur:
    name: Package AUR
    runs-on: ubuntu-22.04

    needs:
      - release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AUR packages
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                jq \
                pkgconf \
                python

              useradd --create-home --shell /bin/bash builder

              chown -R builder:builder /workspace

              chmod +x scripts/linux/package_aur.sh

              su - builder -c "
                cd /workspace
                ./scripts/linux/package_aur.sh dist/aur
              "
            '

      - name: Upload AUR package artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-aur
          path: dist/aur/
          if-no-files-found: error

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload AUR files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "framebolt-aur-v${VERSION}.tar.gz" \
            -C dist/aur \
            framebolt \
            framebolt-bin \
            framebolt-git

          gh release upload \
            "v${VERSION}" \
            "framebolt-aur-v${VERSION}.tar.gz" \
            --clobber
