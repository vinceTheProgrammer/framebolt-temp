  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04

    needs:
      - build-deb-x64
      - build-deb-arm64
      - build-rpm-fedora-x64
      - build-rpm-fedora-arm64
      - build-rpm-opensuse-x64
      - build-rpm-opensuse-arm64
      - build-flatpak-x64
      - build-flatpak-arm64
      - build-appimage-x64
      - build-appimage-arm64
      - build-snap-x64
      - build-snap-arm64
      - build-arch-x64
      - build-arch-arm64
      - build-windows-portable-x64
      - build-windows-installer-x64
      - build-windows-portable-arm64
      - build-windows-installer-arm64
      - build-windows-msi-x64
      - build-windows-msi-arm64
      - build-macos-arm
      - build-macos-intel
      - build-android-debug
      - build-android-debug-universal

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
           path: release-artifacts
           pattern: '*'
           merge-multiple: true

      - name: Remove intermediate Windows files
        shell: bash
        run: |
          # Remove Windows runtime DLLs accidentally included in the release artifacts
          find release-artifacts -maxdepth 1 -type f -name '*.dll' -delete

          # Remove the GStreamer plugin directory
          rm -rf release-artifacts/lib

          # Remove the standalone Windows executable
          rm -f release-artifacts/framebolt.exe

          echo "Remaining release artifacts:"
          find release-artifacts -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create \
            "v${VERSION}" \
            release-artifacts/* \
            --title "Framebolt v${VERSION}" \
            --generate-notes

  package-aur:
    name: Package AUR
    runs-on: ubuntu-22.04

    needs:
      - release

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AUR packages
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                jq \
                pkgconf \
                python

              groupadd \
              --gid "$HOST_GID" \
              builder

              useradd \
                --uid "$HOST_UID" \
                --gid "$HOST_GID" \
                --create-home \
                --shell /bin/bash \
                builder

              su - builder -c "
                cd /workspace
                ./scripts/linux/package_aur.sh dist/aur
              "
            '
      
      - name: Upload AUR package artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-aur
          path: dist/aur/
          if-no-files-found: error

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload AUR files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "framebolt-aur-v${VERSION}.tar.gz" \
            -C dist/aur \
            framebolt \
            framebolt-bin \
            framebolt-git

          gh release upload \
            "v${VERSION}" \
            "framebolt-aur-v${VERSION}.tar.gz" \
            --clobber
