name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            python3 \
            dpkg-dev \
            libfuse2 \
            flatpak \
            flatpak-builder

      - name: Install Flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install linuxdeploy
        run: |
          sudo curl -L \
            -o /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage

          sudo chmod +x /usr/local/bin/linuxdeploy

      # Build the normal Linux binary first.
      # This binary is used by the Debian and RPM packages.
      - name: Build Framebolt
        run: |
          cargo build -p framebolt-desktop --release

      - name: Package Debian
        run: |
          ./scripts/linux/package_deb.sh

      # Build the AppImage entirely inside CentOS 7 so that
      # the resulting binary is linked against an older glibc.
      - name: Package AppImage in CentOS 7
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            quay.io/centos/centos:7 \
            bash -c '
              set -euo pipefail

              echo "==> Configuring CentOS 7 repositories"

              rm -f /etc/yum.repos.d/CentOS-Base.repo

              printf "%s\n" \
                "[base]" \
                "name=CentOS-7.9.2009 - Base" \
                "baseurl=http://vault.centos.org/centos/7.9.2009/os/\$basearch/" \
                "enabled=1" \
                "gpgcheck=1" \
                "gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7" \
                "" \
                "[updates]" \
                "name=CentOS-7.9.2009 - Updates" \
                "baseurl=http://vault.centos.org/centos/7.9.2009/updates/\$basearch/" \
                "enabled=1" \
                "gpgcheck=1" \
                "gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7" \
                "" \
                "[extras]" \
                "name=CentOS-7.9.2009 - Extras" \
                "baseurl=http://vault.centos.org/centos/7.9.2009/extras/\$basearch/" \
                "enabled=1" \
                "gpgcheck=1" \
                "gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7" \
                > /etc/yum.repos.d/CentOS-Vault.repo

              yum clean all
              yum makecache

              echo "==> Installing build dependencies"

              yum install -y \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkgconfig \
                python3 \
                libunwind-devel \
                gstreamer1-devel \
                glib2-devel

              echo "==> Installing Rust"

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Rust version"
              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build -p framebolt-desktop --release

              test -x target/release/framebolt-desktop

              echo "==> Downloading linuxdeploy"

              curl -fL \
                -o /usr/local/bin/linuxdeploy \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage

              chmod +x /usr/local/bin/linuxdeploy

              echo "==> Packaging AppImage"

              export APPIMAGE_EXTRACT_AND_RUN=1

              ./scripts/linux/package_appimage.sh

              echo "==> AppImage output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)"
            '

      - name: Package RPM - Fedora
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -c '
              set -euo pipefail

              dnf install -y \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer1 \
                gstreamer1-devel \
                gstreamer1-plugins-base \
                gstreamer1-plugins-base-devel

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build \
                -p framebolt-desktop \
                --release

              ./scripts/linux/package_rpm_fedora.sh
            '

      - name: Package RPM - openSUSE
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            opensuse/leap:15.6 \
            bash -c '
              set -euo pipefail

              zypper --non-interactive refresh

              zypper --non-interactive install \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer-devel \
                gstreamer

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build \
                -p framebolt-desktop \
                --release

              ./scripts/linux/package_rpm_opensuse.sh
            '

      - name: Package Flatpak
        run: |
          ./scripts/linux/package_flatpak.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: framebolt-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
          if-no-files-found: error