name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build-deb-x64:
    uses: ./.github/workflows/build-deb-x64.yml

  build-deb-arm64:
    uses: ./.github/workflows/build-deb-arm64.yml

  build-rpm-fedora-x64:
    uses: ./.github/workflows/build-rpm-fedora-x64.yml

  build-rpm-fedora-arm64:
    uses: ./.github/workflows/build-rpm-fedora-arm64.yml

  build-rpm-opensuse-x64:
    uses: ./.github/workflows/build-rpm-opensuse-x64.yml

  build-rpm-opensuse-arm64:
    uses: ./.github/workflows/build-rpm-opensuse-arm64.yml

  build-appimage-x64:
    uses: ./.github/workflows/build-appimage-x64.yml

  build-appimage-arm64:
    uses: ./.github/workflows/build-appimage-arm64.yml

  build-flatpak-x64:
    uses: ./.github/workflows/build-flatpak-x64.yml

  build-flatpak-arm64:
    uses: ./.github/workflows/build-flatpak-arm64.yml

  build-snap-x64:
    uses: ./.github/workflows/build-snap-x64.yml

  build-snap-arm64:
    uses: ./.github/workflows/build-snap-arm64.yml
  
  build-arch-bin-x64:
    uses: ./.github/workflows/build-arch-bin-x64.yml

  build-arch-bin-arm64:
    uses: ./.github/workflows/build-arch-bin-arm64.yml

  build-windows-x64:
    uses: ./.github/workflows/build-windows-x64.yml

  build-windows-arm64:
    uses: ./.github/workflows/build-windows-arm64.yml

  build-windows-portable-x64:
    needs:
          - build-windows-x64
    uses: ./.github/workflows/build-windows-portable-x64.yml

  build-windows-portable-arm64:
    needs:
          - build-windows-arm64
    uses: ./.github/workflows/build-windows-portable-arm64.yml

  build-windows-installer-x64:
    needs:
          - build-windows-x64
    uses: ./.github/workflows/build-windows-installer-x64.yml

  build-windows-installer-arm64:
    needs:
          - build-windows-arm64
    uses: ./.github/workflows/build-windows-installer-arm64.yml

  build-windows-msi-x64:
    needs:
        - build-windows-x64
    uses: ./.github/workflows/build-windows-msi-x64.yml

  build-windows-msi-arm64:
    needs:
        - build-windows-arm64
    uses: ./.github/workflows/build-windows-msi-arm64.yml

  build-macos-arm:
    uses: ./.github/workflows/build-macos-arm.yml

  build-macos-intel:
    uses: ./.github/workflows/build-macos-intel.yml

  build-android-debug:
    uses: ./.github/workflows/build-android-debug.yml


  build-android-debug-universal:
    uses: ./.github/workflows/build-android-debug-universal.yml

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04

    needs:
      - build-deb-x64
      - build-deb-arm64
      - build-rpm-fedora-x64
      - build-rpm-fedora-arm64
      - build-rpm-opensuse-x64
      - build-rpm-opensuse-arm64
      - build-flatpak-x64
      - build-flatpak-arm64
      - build-appimage-x64
      - build-appimage-arm64
      - build-snap-x64
      - build-snap-arm64
      - build-arch-bin-x64
      - build-arch-bin-arm64
      - build-windows-portable-x64
      - build-windows-installer-x64
      - build-windows-portable-arm64
      - build-windows-installer-arm64
      - build-windows-msi-x64
      - build-windows-msi-arm64
      - build-macos-arm
      - build-macos-intel
      - build-android-debug
      - build-android-debug-universal

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
           path: release-artifacts
           pattern: '*'
           merge-multiple: true

      - name: Remove intermediate Windows files
        shell: bash
        run: |
          # Remove Windows runtime DLLs accidentally included in the release artifacts
          find release-artifacts -maxdepth 1 -type f -name '*.dll' -delete

          # Remove the GStreamer plugin directory
          rm -rf release-artifacts/lib

          # Remove the standalone Windows executable
          rm -f release-artifacts/framebolt.exe

          echo "Remaining release artifacts:"
          find release-artifacts -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create \
            "v${VERSION}" \
            release-artifacts/* \
            --title "Framebolt v${VERSION}" \
            --generate-notes

  package-aur:
    needs:
      - release
    uses: ./.github/workflows/package-aur.yml
