name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  # ------------------------------------------------------------
  # Debian / .deb
  # ------------------------------------------------------------
  build-deb:
    name: Build & Package Debian
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            python3 \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release

      - name: Package Debian
        run: |
          ./scripts/linux/package_deb.sh

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-deb
          path: dist/*.deb
          if-no-files-found: error


  # ------------------------------------------------------------
  # Fedora / RPM
  # ------------------------------------------------------------
  build-rpm-fedora:
    name: Build & Package Fedora RPM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM - Fedora
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -c '
              set -euo pipefail

              echo "==> Installing Fedora dependencies"

              dnf install -y \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer1 \
                gstreamer1-devel \
                gstreamer1-plugins-base \
                gstreamer1-plugins-base-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Packaging Fedora RPM"

              ./scripts/linux/package_rpm_fedora.sh

              echo "==> RPM output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.rpm" -print -quit)"
            '

      - name: Upload Fedora RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-rpm-fedora
          path: dist/*.rpm
          if-no-files-found: error


  # ------------------------------------------------------------
  # openSUSE Leap / RPM
  # ------------------------------------------------------------
  build-rpm-opensuse:
    name: Build & Package openSUSE RPM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM - openSUSE
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            opensuse/leap:15.6 \
            bash -c '
              set -euo pipefail

              echo "==> Refreshing openSUSE repositories"

              zypper --non-interactive refresh

              echo "==> Installing openSUSE dependencies"

              zypper --non-interactive install \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkg-config \
                python3 \
                rpm-build \
                tar \
                gzip \
                gstreamer-devel \
                gstreamer

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Packaging openSUSE RPM"

              ./scripts/linux/package_rpm_opensuse.sh

              echo "==> RPM output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.rpm" -print -quit)"
            '

      - name: Upload openSUSE RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-rpm-opensuse
          path: dist/*.rpm
          if-no-files-found: error


  # ------------------------------------------------------------
  # AppImage
  #
  # Built inside Rocky Linux 8 to target an older glibc while
  # still providing a sufficiently modern Linux userspace for
  # the Rust/GStreamer stack.
  # ------------------------------------------------------------
  build-appimage:
    name: Build & Package AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage in Rocky Linux 8
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:8 \
            bash -c '
              set -euo pipefail

              echo "==> Installing dependencies"

              dnf install -y \
                epel-release

              dnf install -y \
                curl \
                file \
                gcc \
                gcc-c++ \
                make \
                pkgconf-pkg-config \
                python3 \
                findutils \
                libunwind-devel \
                gstreamer1-devel \
                glib2-devel

              echo "==> Installing Rust"

              curl --proto "=https" \
                --tlsv1.2 \
                -sSf \
                https://sh.rustup.rs \
                | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "==> Toolchain"

              rustc --version
              cargo --version

              echo "==> GStreamer"

              pkg-config --modversion gstreamer-1.0
              pkg-config --cflags --libs gstreamer-1.0

              echo "==> Building Framebolt"

              cargo build \
                -p framebolt-desktop \
                --release

              test -x target/release/framebolt-desktop

              echo "==> Installing linuxdeploy"

              curl -fL \
                -o /usr/local/bin/linuxdeploy \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage

              chmod +x /usr/local/bin/linuxdeploy

              export APPIMAGE_EXTRACT_AND_RUN=1

              echo "==> Packaging AppImage"

              ./scripts/linux/package_appimage.sh

              echo "==> AppImage output"

              ls -lah dist/

              test -n "$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)"
            '

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-appimage
          path: dist/*.AppImage
          if-no-files-found: error


  # ------------------------------------------------------------
  # Flatpak
  # ------------------------------------------------------------
  build-flatpak:
    name: Build & Package Flatpak
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev \
            flatpak \
            flatpak-builder

      - name: Install Flatpak runtime
        run: |
         sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Framebolt
        run: |
          cargo build \
            -p framebolt-desktop \
            --release
          
      - name: Package Flatpak
        run: |
          ./scripts/linux/package_flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  build-snap:
    name: Build & Package Snap
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Snap package
        run: |
          ./scripts/linux/init_package_snap.sh

      - name: Build Snap
        uses: canonical/action-build@v1
        id: snapcraft

      - name: Copy Snap to dist
        run: |
          mkdir -p dist
          cp "${{ steps.snapcraft.outputs.snap }}" dist/

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-snap
          path: dist/*.snap
          if-no-files-found: error
  
  build-arch:
    name: Build & Package Arch
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                pkgconf \
                python \
                gstreamer \
                gst-plugins-base \
                glib2

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build \
                -p framebolt-desktop \
                --release

              mkdir -p dist

              install -Dm755 \
                target/release/framebolt-desktop \
                dist/framebolt-x86_64
            '

      - name: Verify Arch binary
        run: |
          file dist/framebolt-x86_64
          readelf -d dist/framebolt-x86_64 | grep NEEDED

      - name: Upload Arch binary
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-x86_64
          path: dist/framebolt-x86_64
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install GStreamer
        shell: pwsh
        run: |
          $GStreamerVersion = "1.24.13"

          $GStreamerRoot = "C:\gstreamer\1.0\msvc_x86_64"

          $RuntimeUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$GStreamerVersion/msvc/gstreamer-1.0-msvc-x86_64-$GStreamerVersion.msi"
          $DevelUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$GStreamerVersion/msvc/gstreamer-1.0-devel-msvc-x86_64-$GStreamerVersion.msi"

          $RuntimeMsi = "$env:RUNNER_TEMP\gstreamer-runtime.msi"
          $DevelMsi = "$env:RUNNER_TEMP\gstreamer-devel.msi"

          Write-Host "Downloading GStreamer runtime..."
          Invoke-WebRequest `
            -Uri $RuntimeUrl `
            -OutFile $RuntimeMsi

          Write-Host "Downloading GStreamer development package..."
          Invoke-WebRequest `
            -Uri $DevelUrl `
            -OutFile $DevelMsi

          Write-Host "Installing GStreamer runtime..."
          Start-Process msiexec.exe `
            -ArgumentList "/i `"$RuntimeMsi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\gstreamer-runtime.log`"" `
            -Wait `
            -NoNewWindow

          if ($LASTEXITCODE -ne 0) {
            throw "GStreamer runtime installation failed."
          }

          Write-Host "Installing GStreamer development package..."
          Start-Process msiexec.exe `
            -ArgumentList "/i `"$DevelMsi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\gstreamer-devel.log`"" `
            -Wait `
            -NoNewWindow

          if ($LASTEXITCODE -ne 0) {
            throw "GStreamer development installation failed."
          }

          if (-not (Test-Path $GStreamerRoot)) {
            throw "GStreamer installation was not found at $GStreamerRoot"
          }

          "$GStreamerRoot\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8

          Write-Host "GStreamer installed at:"
          Write-Host "  $GStreamerRoot"

      - name: Verify GStreamer
        shell: pwsh
        run: |
          where.exe pkg-config
          where.exe gst-launch-1.0

          pkg-config --modversion gstreamer-1.0
          gst-launch-1.0 --version

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $Version = cargo metadata `
            --format-version 1 `
            --no-deps |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Select-Object -First 1 |
            Select-Object -ExpandProperty version

          "version=$Version" >> $env:GITHUB_OUTPUT
          "FRAMEBOLT_VERSION=$Version" >> $env:GITHUB_ENV

      - name: Build Framebolt
        shell: pwsh
        run: |
          cargo build `
            --release `
            --locked `
            -p framebolt-desktop `
            --target x86_64-pc-windows-msvc

      - name: Prepare Windows staging directory
        shell: pwsh
        run: |
          $Stage = "dist/windows-staging"

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $Stage

          New-Item `
            -ItemType Directory `
            -Force `
            $Stage | Out-Null

          Copy-Item `
            "target/x86_64-pc-windows-msvc/release/framebolt-desktop.exe" `
            "$Stage/framebolt.exe"

          $GStreamerRoot = "C:\gstreamer\1.0\msvc_x86_64"

          Write-Host "Copying GStreamer runtime..."

          Copy-Item `
            "$GStreamerRoot\bin\*.dll" `
            "$Stage" `
            -Force

          New-Item `
            -ItemType Directory `
            -Force `
            "$Stage/lib/gstreamer-1.0" | Out-Null

          Copy-Item `
            "$GStreamerRoot/lib/gstreamer-1.0/*.dll" `
            "$Stage/lib/gstreamer-1.0" `
            -Force

          Write-Host "Windows staging contents:"
          Get-ChildItem `
            $Stage `
            -Recurse |
            Select-Object FullName, Length

      - name: Verify Windows binary
        shell: pwsh
        run: |
          $Binary = "dist/windows-staging/framebolt.exe"

          if (-not (Test-Path $Binary)) {
            throw "Windows binary was not created."
          }

          Get-Item $Binary | Format-List Name,Length,FullName

      - name: Upload Windows staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-windows-staging
          path: dist/windows-staging/
          if-no-files-found: error
          
  build-windows-portable:
    name: Build Windows Portable
    runs-on: windows-2022

    needs:
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows staging
        uses: actions/download-artifact@v8
        with:
          name: framebolt-windows-staging
          path: dist/windows-staging

      - name: Get version
        shell: pwsh
        run: |
          $Version = cargo metadata `
            --format-version 1 `
            --no-deps |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Select-Object -First 1 |
            Select-Object -ExpandProperty version

          "FRAMEBOLT_VERSION=$Version" >> $env:GITHUB_ENV

      - name: Package portable ZIP
        shell: pwsh
        run: |
          ./scripts/windows/package_windows_portable.ps1

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-windows-portable
          path: dist/*.zip
          if-no-files-found: error

  build-windows-installer:
    name: Build Windows Installer
    runs-on: windows-2022

    needs:
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows staging
        uses: actions/download-artifact@v8
        with:
          name: framebolt-windows-staging
          path: dist/windows-staging

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Get version
        shell: pwsh
        run: |
          $Version = cargo metadata `
            --format-version 1 `
            --no-deps |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Select-Object -First 1 |
            Select-Object -ExpandProperty version

          "FRAMEBOLT_VERSION=$Version" >> $env:GITHUB_ENV

      - name: Package Windows installer
        shell: pwsh
        run: |
          ./scripts/windows/package_windows_installer.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04

    needs:
      - build-deb
      - build-rpm-fedora
      - build-rpm-opensuse
      - build-flatpak
      - build-appimage
      - build-snap
      - build-arch
      - build-windows

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: '*'
          merge-multiple: true

      - name: List release artifacts
        run: |
          find release-artifacts \
            -type f \
            -maxdepth 2 \
            -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create \
            "v${VERSION}" \
            release-artifacts/* \
            --title "Framebolt v${VERSION}" \
            --generate-notes

  package-aur:
    name: Package AUR
    runs-on: ubuntu-22.04

    needs:
      - release

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AUR packages
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                jq \
                pkgconf \
                python

              groupadd \
              --gid "$HOST_GID" \
              builder

              useradd \
                --uid "$HOST_UID" \
                --gid "$HOST_GID" \
                --create-home \
                --shell /bin/bash \
                builder

              su - builder -c "
                cd /workspace
                ./scripts/linux/package_aur.sh dist/aur
              "
            '
      
      - name: Upload AUR package artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-aur
          path: dist/aur/
          if-no-files-found: error

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload AUR files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "framebolt-aur-v${VERSION}.tar.gz" \
            -C dist/aur \
            framebolt \
            framebolt-bin \
            framebolt-git

          gh release upload \
            "v${VERSION}" \
            "framebolt-aur-v${VERSION}.tar.gz" \
            --clobber
