on:
  workflow_call:

jobs:
  build-android-debug-universal:
    name: Android Debug (Universal)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "ndk;25.2.9519653"

      - name: Set Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            armv7-linux-androideabi
            aarch64-linux-android
            i686-linux-android
            x86_64-linux-android

      - name: Install Android Rust targets
        shell: bash
        run: |
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            i686-linux-android \
            x86_64-linux-android

      - name: Install cargo-apk2
        shell: bash
        run: |
          cargo install cargo-apk2

      - name: Download GStreamer
        shell: bash
        run: |
          ./scripts/android/download_gstreamer.sh

      - name: Stage GStreamer
        shell: bash
        run: |
          ./scripts/android/stage_gstreamer.sh

      - name: Configure all Android targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Cargo.toml")
          text = path.read_text()

          replacement = """build_targets = [
              "armv7-linux-androideabi",
              "aarch64-linux-android",
              "i686-linux-android",
              "x86_64-linux-android",
          ]"""

          pattern = r'build_targets\s*=\s*\[(?:[^\]]|\n)*\]'

          updated, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not find package.metadata.android.build_targets "
                  "in Cargo.toml"
              )

          path.write_text(updated)

          print("Configured universal Android build:")
          print(replacement)
          PY

      - name: Build Android universal debug APK
        shell: bash
        run: |
          ./scripts/android/build_debug.sh

      - name: Package universal APK
        shell: bash
        run: |
          mkdir -p dist/android

          cp target/debug/apk/framebolt.apk \
            dist/android/framebolt-android-debug-universal.apk

          ls -lh dist/android/framebolt-android-debug-universal.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-universal
          path: dist/android/framebolt-android-debug-universal.apk
          if-no-files-found: error