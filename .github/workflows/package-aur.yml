on:
  workflow_call:

jobs:
  package-aur:
    name: Package AUR
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AUR packages
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                jq \
                pkgconf \
                python

              groupadd \
              --gid "$HOST_GID" \
              builder

              useradd \
                --uid "$HOST_UID" \
                --gid "$HOST_GID" \
                --create-home \
                --shell /bin/bash \
                builder

              su - builder -c "
                cd /workspace
                ./scripts/linux/package_aur.sh dist/aur
              "
            '
      
      - name: Upload AUR package artifact
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-aur
          path: dist/aur/
          if-no-files-found: error

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload AUR files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "framebolt-aur-v${VERSION}.tar.gz" \
            -C dist/aur \
            framebolt \
            framebolt-bin \
            framebolt-git

          gh release upload \
            "v${VERSION}" \
            "framebolt-aur-v${VERSION}.tar.gz" \
            --clobber