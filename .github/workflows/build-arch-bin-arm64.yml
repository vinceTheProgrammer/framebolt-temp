on:
  workflow_call:

jobs:
  build-arch-bin-arm64:
    name: Build Arch binary (aarch64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm

              pacman -S --noconfirm \
                base-devel \
                curl \
                pkgconf \
                python \
                gstreamer \
                gst-plugins-base \
                glib2

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              cargo build --bin framebolt \
                --release

              mkdir -p dist

              install -Dm755 \
                target/release/framebolt \
                dist/framebolt-arm64
            '

      - name: Verify Arch binary
        run: |
          file dist/framebolt-arm64
          readelf -d dist/framebolt-arm64 | grep NEEDED

      - name: Upload Arch binary
        uses: actions/upload-artifact@v7
        with:
          name: framebolt-arm64
          path: dist/framebolt-arm64
          if-no-files-found: error