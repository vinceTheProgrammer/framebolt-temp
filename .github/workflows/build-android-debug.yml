on:
  workflow_call:

jobs:
  build-android-debug:
    name: Android Debug (${{ matrix.name }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7
            target: armv7-linux-androideabi
            artifact: framebolt-android-debug-armv7.apk

          - name: arm64
            target: aarch64-linux-android
            artifact: framebolt-android-debug-arm64.apk

          - name: x86
            target: i686-linux-android
            artifact: framebolt-android-debug-x86.apk

          - name: x86_64
            target: x86_64-linux-android
            artifact: framebolt-android-debug-x86_64.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libunwind-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "ndk;25.2.9519653"

      - name: Set Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            armv7-linux-androideabi
            aarch64-linux-android
            i686-linux-android
            x86_64-linux-android

      - name: Install Android Rust targets
        shell: bash
        run: |
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            i686-linux-android \
            x86_64-linux-android

      - name: Install cargo-apk2
        shell: bash
        run: |
          cargo install cargo-apk2

      - name: Download GStreamer
        shell: bash
        run: |
          ./scripts/android/download_gstreamer.sh

      - name: Stage GStreamer
        shell: bash
        run: |
          ./scripts/android/stage_gstreamer.sh

      - name: Configure Android target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()

          target = os.environ["TARGET"]

          targets = [
              "armv7-linux-androideabi",
              "aarch64-linux-android",
              "i686-linux-android",
              "x86_64-linux-android",
          ]

          replacement = "build_targets = [\n"
          replacement += f'    "{target}",\n'
          replacement += "]"

          pattern = r'build_targets\s*=\s*\[(?:[^\]]|\n)*\]'

          updated, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not find package.metadata.android.build_targets "
                  "in Cargo.toml"
              )

          path.write_text(updated)

          print(f"Configured Android build target: {target}")
          PY

          echo "Updated build_targets:"
          grep -A5 -B1 'build_targets' Cargo.toml

      - name: Build Android debug APK
        shell: bash
        run: |
          ./scripts/android/build_debug.sh

      - name: Rename APK
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            armv7-linux-androideabi)
              NAME="framebolt-android-debug-armv7.apk"
              ;;
            aarch64-linux-android)
              NAME="framebolt-android-debug-arm64.apk"
              ;;
            i686-linux-android)
              NAME="framebolt-android-debug-x86.apk"
              ;;
            x86_64-linux-android)
              NAME="framebolt-android-debug-x86_64.apk"
              ;;
            *)
              echo "Unsupported target: $TARGET"
              exit 1
              ;;
          esac

          mkdir -p dist/android

          cp target/debug/apk/framebolt.apk \
            "dist/android/$NAME"

          echo "Created dist/android/$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ matrix.name }}
          path: dist/android/${{ matrix.artifact }}
          if-no-files-found: error