[package]
name = "framebolt"
edition.workspace = true
version.workspace = true

[package.metadata.android]
use_aapt2 = true

package = "com.framebolt.app"

# Specifies the array of targets to build for.
build_targets = [ 
    # "armv7-linux-androideabi", 
    "aarch64-linux-android", 
    # "i686-linux-android", 
    # "x86_64-linux-android" 
]

strip = "strip"

# resources = "path/to/resources_folder"

assets = "./assets"

runtime_libs = "res/android/libs"

java_sources = "res/android/src"

[package.metadata.android.signing.release]
path = "res/android/framebolt-release.keystore"
keystore_password = "$FRAMEBOLT_KEYSTORE_PASSWORD"
alias = "framebolt"
key_password = "$FRAMEBOLT_KEY_PASSWORD"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 34

[package.metadata.android.application]
has_code = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[[package.metadata.android.application.activity]]
name = ".MainActivity"
orientation = "landscape"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "framebolt"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "framebolt"
path = "src/main.rs"

[workspace]
resolver = "2"

members = [
    "crates/framebolt-core",
    "crates/framebolt-gstreamer",
    "crates/framebolt-media",
    "crates/framebolt-canvas",
    "crates/framebolt-egui",
]

[workspace.package]
edition = "2024"
version = "0.1.16"

[workspace.dependencies]
framebolt-core = { path = "crates/framebolt-core" }
framebolt-egui = { path = "crates/framebolt-egui" }

eframe = { version = "0.33.3", default-features = false }
egui_dock = "0.18.0"
glam = "0.32.1"
wasmtime = "42.0.1"
wgpu = "27.0.1"
winit = { version = "0.30.13", default-features = false }

jni = "0.21"
cargo-apk2 = "1.3.6"


[dependencies]
framebolt-core.workspace = true
framebolt-egui.workspace = true
glam.workspace = true
wasmtime.workspace = true
wgpu.workspace = true
egui_dock.workspace = true


# ─────────────────────────────────────────────
# Desktop
# ─────────────────────────────────────────────

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { workspace = true, features = ["wgpu"] }


# ─────────────────────────────────────────────
# Android
# ─────────────────────────────────────────────

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, default-features = false, features = ["wgpu", "android-native-activity", "default_fonts",]}
winit = { workspace = true, default-features = false }

jni.workspace = true
cargo-apk2.workspace = true


# ─────────────────────────────────────────────
# iOS
# ─────────────────────────────────────────────

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { workspace = true, default-features = false, features = ["wgpu", "default_fonts",]}
winit = { workspace = true, default-features = false }


[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
